# kind cluster config for the bhn-sim lab.
#
# The guide's `kind create cluster --name bhn-sim` works fine, but this file makes
# two things explicit that you will want from Day 2 onward:
#
#  1. extraPortMappings — lets a NodePort service be reached from your Windows browser
#     without a kubectl port-forward held open in a terminal. Under WSL2, Windows
#     forwards localhost into the distro automatically, so localhost:30080 in Chrome
#     lands here.
#  2. A pinned node image — so a kind upgrade six days from now does not silently
#     change your Kubernetes version mid-series.
#
# Resulting kubectl context is "kind-bhn-sim", NOT "bhn-sim". (CORRECTIONS-DAY1.md B1)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bhn-sim
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
