# ============================================================================
#  GAME DAY 1 — "the friday afternoon special"            DO NOT READ BEFORE THE RETRO
#
#  Day 14's scenario-1.sh, rewritten for the Game Day console (Day 24). Run it sealed from
#  Mission Control → Game Day → scenario-1 → Run sealed; one approval runs the schedule
#  server-side and the steps stay hidden until you press Retro. Reset all ends it.
#  The old .sh stays for the record (and for a run without the console).
# ============================================================================
id: scenario-1
title: "Game day 1 — the friday afternoon special"
summary: >-
  Written in the morning, half-forgotten by the afternoon. Something will go wrong, maybe more
  than one thing. Respond from the browser; write down every time you leave it.
steps:
  - at_seconds: 0
    action: set_fault
    params: {target: egift, knob: EMAIL_FAIL_RATE, value: "0.35"}
    note: >-
      Loud: a partner's email delivery degrades — 35% of eGift orders fail at send_email.
      Activation is fine, no deploy happened. The trap is to look at activation, because that
      is where every earlier egift incident came from. kb-003: escalate to the partner.
  - at_seconds: 180
    action: set_fault
    params: {target: settlement, knob: SETTLEMENT_FAIL_MODE, value: silent}
    note: >-
      Quiet and unrelated: settlement reconciles zero records. Since Day 8 the job self-checks
      and exits 2 → SettlementJobFailed → the remediator re-runs it → it fails again → "human
      required"; SettlementStale follows at 15 min. Nothing about it is in the egift ticket.
      The trap is anchoring on fault 1 and never noticing the second row on the overview.
