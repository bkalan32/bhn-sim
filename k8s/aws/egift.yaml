# GENERATED by scripts/163-eks-deploy.sh from k8s/egift.yaml — edit THAT file. Only the image line differs (and kind's NodePort door is gone).
# egift service — deployment, service, NodePort front door, Prometheus scrape config.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egift
  namespace: payments
  labels:
    app: egift
spec:
  replicas: 2
  selector:
    matchLabels:
      app: egift
  template:
    metadata:
      labels:
        app: egift
        version: "0.1"
    spec:
      containers:
        - name: egift
          image: 831926603642.dkr.ecr.us-east-2.amazonaws.com/bhn-sim/egift:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
              name: http
          env:
            - name: ACTIVATION_URL
              value: http://activation.payments:8000/activate
            - name: ACTIVATION_TIMEOUT_S
              value: "5"
            # Incident controls
            - name: DELIVERY_DELAY_MS
              value: "40"
            - name: EMAIL_FAIL_RATE
              value: "0.01"
            - name: APP_VERSION
              value: "0.1"
            # OpenTelemetry
            - name: OTEL_SERVICE_NAME
              value: egift
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-opentelemetry-collector.tracing:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
              value: "healthz,readyz,metrics"
          readinessProbe:
            httpGet: {path: /readyz, port: 8010}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8010}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits:   {cpu: 250m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: egift
  namespace: payments
  labels:
    app: egift
spec:
  selector:
    app: egift
  ports:
    - port: 8010
      targetPort: 8010
      name: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: egift
  namespace: payments
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: egift
  namespaceSelector:
    matchNames: [payments]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
