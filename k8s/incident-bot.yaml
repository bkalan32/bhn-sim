# incident-bot — the ticketing layer. Deployment + PVC + Service + ServiceMonitor.
#
# FIX vs the PDF: it mounts an emptyDir at /data. An emptyDir dies with the pod, and a
# pod is replaced on EVERY deploy — Day 9 ships incident-bot:0.2 and Day 10 ships 0.3,
# so you would lose every incident record you had just written about, twice. kind ships
# the local-path provisioner as the default StorageClass, so a PersistentVolumeClaim
# costs one stanza and the records survive restarts and rollouts. (CORRECTIONS-DAY8.md B3)
#
# One replica, strategy Recreate. Day 21: the store is SQLite (incidents.db on this PVC,
# services/incident-bot/store.py) — one writer process by design; WAL lets readers in, but
# two pods on one ReadWriteOnce volume would still be two writers. The README says so in
# "lab shortcuts". On kind this PVC lives INSIDE the node container: it survives pod
# restarts and rollouts, not the node (CORRECTIONS-REBUILD N1).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: incident-bot-data
  namespace: payments
  labels:
    app: incident-bot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-bot
  namespace: payments
  # Day 19: on EKS this service account is associated with an IAM role through Pod Identity
  # (infra/aws/eks/pod-identity.tf) so the bot can run CloudWatch Logs Insights queries —
  # its logs collector on a cluster where Splunk is unreachable. On kind it is just a name.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-bot
  namespace: payments
  labels:
    app: incident-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: incident-bot
  template:
    metadata:
      labels:
        app: incident-bot
    spec:
      serviceAccountName: incident-bot
      # The image runs as uid 10001; fsGroup makes the mounted volume writable by it.
      securityContext:
        fsGroup: 10001
      containers:
        - name: incident-bot
          image: incident-bot:0.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8020
              name: http
          # Day 9: the API key comes from the ai-keys secret (scripts/90-ai-secret.sh).
          # FIX vs the PDF: `optional: true`. Without it the pod cannot START while the
          # secret is missing — which is exactly the state the PDF asks you to test
          # ("delete the key, confirm the incident still records"). Missing key = no
          # drafts, never = no bot. (CORRECTIONS-DAY9.md B2)
          envFrom:
            - secretRef:
                name: ai-keys
                optional: true
            # Day 10: GRAFANA_TOKEN, SPLUNK_URL, SPLUNK_PASSWORD (scripts/100-enrich-config.sh)
            - secretRef:
                name: enrich-config
                optional: true
          env:
            - name: DATA_DIR
              value: /data
            # auto = anthropic if ANTHROPIC_API_KEY is set, else ollama if AI_BASE_URL is
            # set, else none. Force "none" to test the no-AI path (93-ai-resilience.sh).
            # AI_MODEL / AI_BASE_URL come from the secret too (env: wins over envFrom:,
            # so they are deliberately NOT set here). Defaults live in ai.py.
            - name: AI_PROVIDER
              value: auto
            # Day 10: in-cluster addresses of the two sources that have stable DNS names.
            # Splunk lives OUTSIDE the cluster (a plain container on the kind network) and
            # its address comes from the enrich-config secret, rendered by the script.
            - name: PROM_URL
              value: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
            - name: GRAFANA_URL
              value: http://kps-grafana.monitoring
            - name: ENRICH_ENABLED
              value: "true"
            # service = one incident per service outage (default here)
            # group   = one incident per Alertmanager group (the PDF's behaviour)
            - name: INCIDENT_JOIN
              value: service
          volumeMounts:
            - name: data
              mountPath: /data
            # Day 17: the knowledge base (kb/*.md) as a ConfigMap, read-only. Optional, so
            # the bot starts without it (and says so on /ai) — the KB improves diagnosis,
            # it must never gate intake. scripts/172-kb.sh builds and refreshes it.
            - name: kb
              mountPath: /kb
              readOnly: true
          # Day 18 (INC-0019's build 34, CORRECTIONS-DAY17 B10): under VM load the Python
          # imports alone outran the liveness window and the kubelet killed a pod that was
          # merely slow to start — a startup probe gates liveness until the app has bound
          # once (up to 2 min), the way Day 13's Fluent Bit fix did.
          startupProbe:
            httpGet: {path: /healthz, port: 8020}
            periodSeconds: 5
            failureThreshold: 24
          # Day 23 (CORRECTIONS-DAY23 B3): the bot is no longer called only by Alertmanager — mission
          # control's poller, the copilot and MCP clients route log searches, incident reads and KB
          # search through it. At 200m CPU and the default 1 s probe timeout, one busy moment made
          # /readyz miss its second; Kubernetes took the pod out of the Service and the copilot's
          # next call was refused in 16 ms. 3 s timeouts, three misses before "not ready", more CPU.
          readinessProbe:
            httpGet: {path: /readyz, port: 8020}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8020}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits:   {cpu: 500m, memory: 192Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: incident-bot-data
        - name: kb
          configMap:
            name: kb
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: incident-bot
  namespace: payments
  labels:
    app: incident-bot
spec:
  selector:
    app: incident-bot
  ports:
    - port: 8020
      targetPort: 8020
      name: http
---
# Monitor the monitor. incidents_open goes on the overview; IncidentBotDown alerts.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: incident-bot
  namespace: payments
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: incident-bot
  namespaceSelector:
    matchNames: [payments]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
