# Prometheus alert rules for the activation service.
#
# FIX: the PDF's version does not parse. Under ActivationHighLatency, `for:`, `labels:`
# and `annotations:` are indented deeper than `expr:`, so YAML sees them as continuation
# of the expr block rather than sibling keys. Confirmed with a parser:
#   ParserError: expected <block end>, but found '<scalar>'
# Same class of fault as the Day 2 manifest. (CORRECTIONS-DAY3.md B1)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: activation-alerts
  namespace: payments
  labels:
    # Same rule as the ServiceMonitor: without the release label matching the Helm
    # release, the Operator silently ignores this file. No error, no rule, no page.
    release: kps
spec:
  groups:
    - name: activation
      rules:
        - alert: ActivationHighErrorRate
          # FIX: clamp_min on the denominator. The PDF divides by a bare sum(rate(...)),
          # which is 0 whenever traffic stops — and 0/0 is NaN. A rule that evaluates to
          # NaN never fires and never shows as pending. So "the load generator died" and
          # "everything is fine" look identical to your alerting. Silent gap.
          expr: |
            100 * sum(rate(activation_requests_total{status="error"}[2m]))
                / clamp_min(sum(rate(activation_requests_total[2m])), 0.001) > 10
          for: 2m
          labels:
            severity: critical
            service: activation
          annotations:
            summary: "Activation error rate above 10%"
            description: "Error rate is {{ $value | printf \"%.1f\" }}% over the last 2 minutes. Cards are being declined at the till."
            runbook: "Check Grafana 'Activation Service', then Splunk: index=main app.service=activation app.status=error | stats count by app.reason"

        - alert: ActivationHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(activation_latency_seconds_bucket[2m])) by (le)) > 0.5
          for: 2m
          labels:
            severity: warning
            service: activation
          annotations:
            summary: "Activation p95 latency above 500ms"
            description: "p95 is {{ $value | printf \"%.2f\" }}s. Checkout budget is well under a second; queues build at this level."
            runbook: "Usually a slow dependency. Check FRAUD_SVC_DOWN and the fraud_service_timeout reason in Splunk."

        # ADDED: the alert the PDF does not have, and the one that would have caught
        # your Day 2 failure. If traffic stops entirely, every other rule here goes
        # quiet — not because the service is healthy, but because there is nothing to
        # measure. "No data" must be its own alert or it is a blind spot.
        - alert: ActivationNoTraffic
          expr: sum(rate(activation_requests_total[5m])) < 0.1
          for: 5m
          labels:
            severity: warning
            service: activation
          annotations:
            summary: "Activation is receiving no traffic"
            description: "Fewer than 0.1 req/s for 5 minutes. Either the load generator stopped, or callers cannot reach the service at all."
            runbook: "Check the load generator terminal and: kubectl get pods -n payments"

    # ======================================================================
    # Day 5 — SLIs, SLOs, error budgets
    # ======================================================================
    - name: activation-slo
      interval: 30s
      rules:
        # ---- recording rules: service:sli_name:ratio_rateWINDOW -----------
        - record: activation:sli_availability:ratio_rate5m
          expr: |
            sum(rate(activation_requests_total{status="ok"}[5m]))
              / clamp_min(sum(rate(activation_requests_total[5m])), 0.001)
        - record: activation:sli_availability:ratio_rate1h
          expr: |
            sum(rate(activation_requests_total{status="ok"}[1h]))
              / clamp_min(sum(rate(activation_requests_total[1h])), 0.001)
        - record: activation:sli_availability:ratio_rate6h
          expr: |
            sum(rate(activation_requests_total{status="ok"}[6h]))
              / clamp_min(sum(rate(activation_requests_total[6h])), 0.001)
        - record: activation:sli_latency:ratio_rate5m
          expr: |
            sum(rate(activation_latency_seconds_bucket{le="0.3"}[5m]))
              / clamp_min(sum(rate(activation_latency_seconds_count[5m])), 0.001)
        # Burn rate as its own series, so the dashboard and alerts agree exactly.
        - record: activation:error_budget_burn_rate:1h
          expr: (1 - activation:sli_availability:ratio_rate1h) / 0.005
        - record: activation:error_budget_burn_rate:5m
          expr: (1 - activation:sli_availability:ratio_rate5m) / 0.005
        - record: activation:error_budget_burn_rate:6h
          expr: (1 - activation:sli_availability:ratio_rate6h) / 0.005

        # ---- multi-window, multi-burn-rate alerts (Google SRE Workbook) --
        # The crude "error rate > 10%" rule from Day 3 catches catastrophes. It misses
        # the slow bleed: 1.5% errors for two days never trips it, yet burns 3x the
        # monthly budget. Long window = sustained. Short window = still happening.
        - alert: ActivationErrorBudgetBurnFast
          expr: |
            activation:error_budget_burn_rate:1h > 14.4
            and
            activation:error_budget_burn_rate:5m > 14.4
          for: 2m
          labels:
            severity: critical
            service: activation
            slo: availability
          annotations:
            summary: "Activation burning error budget at {{ $value | printf \"%.0f\" }}x — whole month gone in ~2 days"
            description: "1h error rate is 14.4x the 0.5% budget and it is still happening (5m window agrees). At this pace the 30-day budget is exhausted in about 2 days."
            runbook: "Check Grafana 'Activation SLO' burn-rate panel, then Splunk: index=main app.service=activation app.status=error | stats count by app.reason"
        - alert: ActivationErrorBudgetBurnSlow
          expr: |
            activation:error_budget_burn_rate:6h > 6
            and
            activation:error_budget_burn_rate:5m > 6
          for: 15m
          labels:
            severity: warning
            service: activation
            slo: availability
          annotations:
            summary: "Activation burning error budget at {{ $value | printf \"%.0f\" }}x — whole month gone in ~5 days"
            description: "Sustained over 6 hours and still happening. Not a page — a ticket for tomorrow morning."

    # ======================================================================
    # Day 5 — the settlement batch job: alert on ABSENCE, not presence
    # ======================================================================
    - name: settlement
      rules:
        # The important pattern: alert when a good thing STOPS happening, not only
        # when a bad thing starts. Any "expected every N minutes" process needs one.
        - alert: SettlementStale
          expr: time() - settlement_last_success_timestamp > 900
          for: 1m
          labels:
            severity: critical
            service: settlement
          annotations:
            summary: "No successful settlement in 15 minutes (expected every 5)"
            description: "Either the job is not running, is crashing, or is running and not succeeding. If this fires alone, check kubectl get jobs -n payments."
        - alert: SettlementZeroRecords
          expr: settlement_records_processed == 0
          for: 1m
          labels:
            severity: critical
            service: settlement
          annotations:
            summary: "Settlement ran but reconciled zero records"
            description: "Kubernetes says Succeeded. The log says 'settlement complete'. The job processed nothing. Without this rule you find out from finance."
        # FIX vs the PDF: bare `kube_job_status_failed > 0` never resolves. Kubernetes
        # keeps the last failedJobsHistoryLimit (3) Job objects around forever, so the
        # metric stays 1 for each of them long after the cause is fixed. This version
        # only counts jobs that STARTED in the last 15 minutes.
        - alert: SettlementJobFailed
          expr: |
            (kube_job_status_failed{namespace="payments", job_name=~"settlement.*"} > 0)
            and on (job_name)
            (time() - kube_job_status_start_time{namespace="payments", job_name=~"settlement.*"} < 900)
          for: 1m
          labels:
            severity: warning
            service: settlement
          annotations:
            summary: "Settlement job crashed ({{ $labels.job_name }})"
            description: "A settlement Job pod exited non-zero in the last 15 minutes. kubectl logs -n payments job/{{ $labels.job_name }}"

    # ======================================================================
    # Day 8 — backlog #3 from the week-1 review: eGift had NO latency alert. Both
    # Day 4 experiments (INC-0002/0003) were detected by a human watching a screen.
    # ======================================================================
    - name: egift
      rules:
        - alert: EgiftHighErrorRate
          expr: |
            100 * sum(rate(egift_orders_total{status="error"}[2m]))
                / clamp_min(sum(rate(egift_orders_total[2m])), 0.001) > 10
          for: 2m
          labels:
            severity: critical
            service: egift
          annotations:
            summary: "eGift order error rate above 10%"
            description: "{{ $value | printf \"%.1f\" }}% of corporate eGift orders are failing over the last 2 minutes."
            runbook: "Splunk: index=main app.service=egift app.status=error | stats count by app.reason. If reason is activation_*, it is INC-0001's shape: look at activation first."
        - alert: EgiftHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(egift_order_latency_seconds_bucket[5m])) by (le)) > 2
          for: 5m
          labels:
            severity: warning
            service: egift
          annotations:
            summary: "eGift p95 order latency above 2s"
            description: "p95 is {{ $value | printf \"%.2f\" }}s over 5 minutes. Orders complete, slowly. The step alert (EgiftStepSlow) names the culprit."
            runbook: "Grafana 'eGift Service' step panel, or Tempo: Search service=egift, sort by duration."
        # Names the culprit. The per-step histogram exists for exactly this (Day 4 fix).
        - alert: EgiftStepSlow
          expr: |
            histogram_quantile(0.95, sum(rate(egift_step_latency_seconds_bucket[5m])) by (le, step)) > 1.5
          for: 5m
          labels:
            severity: warning
            service: egift
          annotations:
            summary: "eGift step '{{ $labels.step }}' p95 above 1.5s"
            description: "The '{{ $labels.step }}' step of an eGift order is taking {{ $value | printf \"%.2f\" }}s at p95. activate = the activation dependency (or the network to it); send_email = the email provider."

    # ======================================================================
    # Day 8 — monitor the monitor. If the bot is down, nothing becomes a ticket.
    # ======================================================================
    - name: incident-bot
      rules:
        - alert: IncidentBotDown
          expr: |
            up{job="incident-bot"} == 0 or absent(up{job="incident-bot"})
          for: 2m
          labels:
            severity: critical
            service: incident-bot
          annotations:
            summary: "incident-bot is not being scraped — alerts are not becoming incidents"
            description: "Alertmanager will retry webhooks with backoff while the bot is down, so nothing is lost yet — but nobody is being told."
            runbook: "kubectl get pods -n payments -l app=incident-bot; kubectl logs -n payments deploy/incident-bot | python3 tools/logfmt.py"

    # ======================================================================
    # Day 12 — what the remediator keys off, and monitoring the remediator.
    # kube-prometheus-stack ships KubePodCrashLooping, but (a) it carries no `service`
    # label, so our Day 8 routing drops it before either receiver sees it, and (b) it has
    # `for: 15m` — a drill would wait a quarter of an hour. This rule fires after 2 minutes
    # of CrashLoopBackOff in payments and derives the service label from the pod name, so
    # it becomes a ticket AND a remediation trigger through the existing route.
    - name: remediation
      rules:
        - alert: PaymentsPodCrashLooping
          expr: |
            label_replace(
              max by (pod, container) (kube_pod_container_status_waiting_reason{namespace="payments", reason="CrashLoopBackOff"}) == 1,
              "service", "$1", "pod", "^(activation|egift|settlement|incident-bot|remediator|crashtest)-.*")
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is crash-looping ({{ $labels.container }})"
            description: "CrashLoopBackOff for 2 minutes in payments. Remediation tier 1: the remediator deletes this pod once; if the replacement loops too, the failure is real."
            runbook: "kubectl -n payments describe pod {{ $labels.pod }}; kubectl -n payments logs {{ $labels.pod }} --previous"
        - alert: RemediatorDown
          expr: |
            up{job="remediator"} == 0 or absent(up{job="remediator"})
          for: 2m
          labels:
            severity: warning
            service: remediator
          annotations:
            summary: "remediator is not being scraped — tier-1 fixes and tier-2 proposals are not happening"
            description: "Incidents still record (the bot is separate); nothing is being remediated or proposed."
            runbook: "kubectl get pods -n payments -l app=remediator; kubectl logs -n payments deploy/remediator | python3 tools/logfmt.py"

    # ======================================================================
    # Day 7 — health scores. The opinion lives in docs/health-score.md.
    # Rules evaluate in group order, so these depend on activation-slo above.
    # ======================================================================
    - name: health-scores
      interval: 30s
      rules:
        # Each term: linear from 0 at (target - 10 budgets) to 1 at target, clamped.
        # FIX: the PDF normalises against the target itself (avail / 0.995), which
        # leaves a 50% outage scoring 70. See docs/health-score.md for the arithmetic.
        - record: activation:health_score
          expr: |
            clamp_min(clamp_max(
                60 * clamp_max(clamp_min((activation:sli_availability:ratio_rate5m - 0.95) / 0.045, 0), 1)
              + 40 * clamp_max(clamp_min((activation:sli_latency:ratio_rate5m      - 0.90) / 0.09,  0), 1)
            , 100), 0)
        - record: egift:health_score
          expr: |
            clamp_min(clamp_max(
                70 * clamp_max(clamp_min((
                      sum(rate(egift_orders_total{status="ok"}[5m]))
                        / clamp_min(sum(rate(egift_orders_total[5m])), 0.001)
                      - 0.95) / 0.045, 0), 1)
              + 30 * clamp_max(clamp_min(
                      (2.5 - histogram_quantile(0.95, sum(rate(egift_order_latency_seconds_bucket[5m])) by (le))) / 2.0
                    , 0), 1)
            , 100), 0)
        # FIX: settlement metrics come via the Pushgateway and carry labels
        # (job="settlement", instance=""). The activation/egift scores carry none. PromQL
        # cannot add vectors whose labels differ, so the PDF's platform average silently
        # returns NOTHING. max() strips the labels before the arithmetic.
        - record: settlement:health_score
          expr: |
            clamp_min(clamp_max(
                70 * (max(time() - settlement_last_success_timestamp) < bool 900)
              + 30 * (max(settlement_records_processed) > bool 0)
            , 100), 0)
        - record: platform:health_score
          expr: |
            (activation:health_score + egift:health_score + settlement:health_score) / 3
