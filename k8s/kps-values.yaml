# Alertmanager routing for kube-prometheus-stack (release "kps").
#
# Apply with ./scripts/81-alertmanager-route.sh, which pins the chart version you already
# run and passes --reuse-values. Helm merges this over the chart defaults: the keys you
# name here replace the chart's, everything else (inhibit rules, templates) stays.
#
# Three differences from the PDF's file, all in CORRECTIONS-DAY8.md:
#
#  B1  Default receiver is "null", not the bot. The PDF sends EVERYTHING to the bot:
#      Watchdog (fires forever by design) and the nine kube-system false positives a kind
#      cluster carries (scheduler/controller-manager/proxy "down") would each become a
#      permanent open incident within a minute of the upgrade. Only alerts carrying one
#      of OUR service labels reach the bot.
#
#  B2  No severity sub-route. Alertmanager's group key includes the route that matched,
#      so "critical -> one route, warning -> the default" splits one outage's alerts into
#      two groups, two webhooks, two incidents — the opposite of the PDF's own design
#      note. One route per service family; group_wait is short for everyone because in
#      this lab seconds cost nothing. Critical-vs-warning is still in the record (the
#      bot ranks severity); it just does not fragment the ticket.
#
#  D1  group_by: ["service"], not ["alertname", "service"]. The PDF offers both and says
#      "pick an opinion". Opinion: one incident per service outage. Alert names are inside
#      the record; a responder wants one ticket for "activation is broken", not three.
#      Flip it back to see the difference — it is a real design choice.
alertmanager:
  config:
    route:
      receiver: "null"
      group_by: ["service"]
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 6h
      routes:
        # Watchdog is the "Alertmanager is alive" heartbeat. It must fire forever; it
        # must never become a ticket.
        - matchers: ['alertname = "Watchdog"']
          receiver: "null"
        # Day 18 (docs/alert-audit.md): explicit null routes ABOVE the ticket route, so the
        # audit's demotions are visible in the config and testable with `amtool config routes
        # test`. severity=info/none is informational by the chart's own convention
        # (InfoInhibitor, Watchdog-adjacent). The named ones are cause-level and not
        # actionable on a laptop: CPU throttling on requests we set deliberately low,
        # overcommit on a one-node cluster. Route, don't delete: an upstream rule removed by
        # hand is drift against the chart (Day 13).
        - matchers: ['severity =~ "info|none"']
          receiver: "null"
        - matchers: ['alertname =~ "CPUThrottlingHigh|KubeMemoryOvercommit|KubeCPUOvercommit|KubeQuotaAlmostFull|NodeClockNotSynchronising"']
          receiver: "null"
        # Everything with one of our service labels becomes an incident.
        # Day 12: + remediator (its own RemediatorDown) and crashtest (the tier-1 drill fixture)
        # Day 18: + platform (PlatformPodRestarting — the restart alert Day 14 asked for)
        - matchers: ['service =~ "activation|egift|settlement|incident-bot|remediator|crashtest|smoke-test|platform"']
          receiver: incident-bot
          continue: false
    receivers:
      - name: "null"
      - name: incident-bot
        webhook_configs:
          - url: "http://incident-bot.payments:8020/alertmanager"
            send_resolved: true
            # Alertmanager retries a failed webhook with backoff, so a bot restart does
            # not lose the notification. Keep the handler fast (Day 9: AI calls go in
            # the background, never inside this request).
            max_alerts: 0
          # Day 12: the same notification, fanned out to the remediator. Two consumers,
          # one receiver — a second receiver would need its own route and could drift.
          # send_resolved: the remediator withdraws pending proposals when the alerts clear.
          - url: "http://remediator.payments:8030/alertmanager"
            send_resolved: true
            max_alerts: 0
          # Day 21: the same notification, a third time, to Mission Control's live feed
          # (/hooks/alertmanager -> the SSE stream). Display only: nothing on that path can act.
          # Same receiver, same route — the PDF's "third receiver" as a third webhook, for the
          # Day 12 reason: a second route could drift from the first. Deploy mission-control
          # BEFORE applying this, or Alertmanager retries a URL that does not exist yet.
          - url: "http://mission-control.payments:8040/hooks/alertmanager"
            send_resolved: true
            max_alerts: 0

# Day 13 (CORRECTIONS-DAY13 B10): with no adminPassword, the Grafana subchart renders a
# RANDOM one and relies on Helm's `lookup` to keep the existing one on upgrade — but
# `lookup` returns nothing in a dry run, so every `terraform plan` saw a new password and
# reported kps as drifted forever. The password now lives in a Secret we own
# (secret/grafana-admin, minted by scripts/134-tf-deterministic.sh from the chart's own);
# the chart renders no secret, and the plan is deterministic.
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password


# Day 18 (docs/alert-audit.md A1): kind runs kube-scheduler, kube-controller-manager, etcd and
# kube-proxy bound to 127.0.0.1 — the chart's scrapes of them cannot succeed, so
# KubeSchedulerDown / KubeControllerManagerDown / TargetDown / etcd* have fired since Day 1
# for components that were fine. An alert that has fired for 18 days is an alert nobody
# reads: Day 14 found the scheduler's 70 real restarts hidden behind its permanent false
# "Down". These are the chart's own switches (the EKS overlay uses the same ones, because
# AWS runs those components): no rule is deleted by hand, the plan stays clean, and the
# components' real health now comes from PlatformPodRestarting (kube-state-metrics, which
# CAN see them).
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
